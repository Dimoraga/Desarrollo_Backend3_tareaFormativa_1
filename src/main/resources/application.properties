spring.application.name=spring-batch-semana1-legacy-migration

# Spring Batch necesita tablas de metadatos para registrar JobInstance, JobExecution y StepExecution.
spring.batch.jdbc.initialize-schema=always

# Con varios Jobs en el contexto, el runner automático de Spring Boot exige
# indicar uno solo. Se desactiva y BatchJobRunner ejecuta los tres a mano.
spring.batch.job.enabled=false

# Base de datos embebida para que el ejemplo sea autocontenido.
spring.datasource.url=jdbc:h2:mem:batchdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Reduce ruido en consola y muestra lo relevante del flujo batch.
logging.level.root=INFO
logging.level.cl.duoc.backendiii.semana1=INFO
logging.level.org.springframework.batch.core.step.AbstractStep=INFO
